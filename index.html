<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
Tayar
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tamara">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--br:#e5e7eb;--pr:#ff6b1a;--ok:#16a34a;--bad:#dc2626;--bl:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--br:#2a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--br:#2a2f3a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:96px}
header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}header small{color:var(--mu)}
.gear{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:12px;font-size:20px;padding:8px 12px}
.shb{margin:4px 16px 10px;background:var(--card);border:1px solid var(--br);border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.shb.on{border-color:var(--ok)}
.shb button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;color:#fff;background:var(--ok);white-space:nowrap}
.shb.on button{background:var(--bad)}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.tabs button{flex:1;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px;border-radius:12px;font:inherit;font-size:14px}
.tabs button.on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.fb{display:flex;gap:8px;padding:0 16px 10px}.fb[hidden]{display:none}.fb input,.fb select{flex:1;min-width:0;padding:10px}
.tabs button{padding:9px 4px!important;font-size:13px!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.st{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:12px}
.st span{display:block;color:var(--mu);font-size:12px}.st b{font-size:21px}
.st.hl{background:var(--pr);border-color:var(--pr);color:#fff;grid-column:1/-1}.st.hl span{color:#ffe6d6}.st.hl b{font-size:28px}
.chart{margin:10px 16px;background:var(--card);border:1px solid var(--br);border-radius:16px;padding:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu)}
.bar i{width:100%;background:var(--pr);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
h2{font-size:15px;margin:14px 16px 8px}
.o{background:var(--card);border:1px solid var(--br);border-radius:16px;margin:0 16px 10px;padding:12px}
.o.done{opacity:.6}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ad{font-weight:700;font-size:15px}.ph{color:var(--mu);direction:ltr;unicode-bidi:embed;font-size:13px}
.tot{font-weight:800;color:var(--pr);font-size:18px;white-space:nowrap}
.sub{color:var(--mu);font-size:12px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{flex:1 1 22%;min-width:70px;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:11px 6px;font:inherit;font-size:14px;font-weight:700;color:#fff}
.call{background:var(--bl)}.dn{background:var(--ok)}.un{background:var(--mu)}.wa{background:#25d366}
.acts .x{flex:0 0 46px;min-width:46px;background:transparent;color:var(--bad);border:1px solid var(--br)}
.empty{text-align:center;color:var(--mu);padding:30px 16px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pr);color:#fff;border:0;border-radius:18px;padding:15px 22px;font:inherit;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(255,107,26,.4)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sh.on{display:flex}
.pn{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.pn h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.row{display:flex;gap:10px}.row>div,.row>button{flex:1}
.sum{margin-top:12px;font-weight:800;text-align:center;font-size:17px}
.btn{width:100%;margin-top:12px;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:800}
.btn.s{background:transparent;color:var(--mu);margin-top:6px;padding:10px;font-weight:400}
.btn.r{background:transparent;color:var(--bad);border:1px solid var(--br)}
.note{color:var(--mu);font-size:12px;margin-top:6px}
#lg{z-index:9;background:var(--bg);align-items:center}
#lg .pn{border-radius:22px;margin:16px;width:auto;max-width:420px;margin-inline:auto}
.hd{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:var(--card);border:1px solid var(--br)}
.hr{display:flex;align-items:center;gap:8px}.av{width:42px;height:42px;border-radius:50%;background:var(--card) center/cover;border:2px solid var(--pr);display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
</head>
<body>
<header><div class="hd"><img id="logo" class="logo" alt="" hidden><div><h1 id="h1">🛵 Tamara</h1><small id="dt"></small></div></div><div class="hr"><div class="av" id="av">👤</div><button class="gear" id="gb">⚙️</button></div></header>
<div class="shb" id="shb"></div>
<div class="tabs" id="tabs">
<button data-r="cur" class="on">الشفت</button><button data-r="week">آخر ٧ أيام</button><button data-r="day">📅 يوم</button><button data-r="all">الكل</button></div>
<div class="fb" id="fb" hidden><input type="date" id="fd"><select id="fs"></select></div>
<div class="stats" id="stats"></div>
<div class="chart"><small style="color:var(--mu)">عدد الأوردرات آخر ٧ أيام</small><div class="bars" id="bars"></div></div>
<div id="shl"></div>
<h2>الأوردرات</h2>
<div id="list"></div>
<button class="fab" id="add">＋ أوردر جديد</button>

<div class="sh" id="sh"><div class="pn">
<h3>أوردر جديد</h3>
<label>رقم العميل</label><input id="ph" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
<label>رقم تاني للعميل (اختياري)</label><input id="ph2" type="tel" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
<label>العنوان</label><input id="ad" placeholder="الشارع، العمارة، علامة مميزة">
<div class="row"><div><label>سعر الطلب</label><input id="pr" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>الشحن</label><input id="fe" type="number" inputmode="decimal" placeholder="0"></div></div>
<label id="cml">العمولة</label><input id="cm" type="number" inputmode="decimal" placeholder="0">
<div class="sum" id="sum"></div>
<button class="btn" id="save">حفظ الأوردر</button>
<button class="btn s" id="cn">إلغاء</button>
</div></div>

<div class="sh" id="cf"><div class="pn">
<h3>الملف الشخصي</h3>
<label>اسم الكابتن</label><input id="cap" placeholder="اسمك">
<div class="row" style="margin-top:10px"><button class="btn" style="background:var(--bl);margin:0;font-size:14px" onclick="$('fph').click()">📷 صورتي</button><button class="btn" style="background:var(--bl);margin:0;font-size:14px" onclick="$('flg').click()">🏪 لوجو المطعم</button></div>
<input type="file" id="fph" accept="image/*" hidden><input type="file" id="flg" accept="image/*" hidden>
<h3 style="margin-top:20px">إعدادات العمولة</h3>
<label>اسم الجهة (مطعم / مكتب)</label><input id="cname" placeholder="المطعم">
<label>نوع العمولة</label><select id="ctype"><option value="pct">نسبة مئوية %</option><option value="fix">مبلغ ثابت لكل أوردر</option></select>
<div id="cbw"><label>تُحسب من</label><select id="cbase"><option value="fee">قيمة الشحن</option><option value="price">سعر الطلب</option></select></div>
<label>القيمة</label><input id="cval" type="number" inputmode="decimal" placeholder="0">
<div class="note">البيانات دي محفوظة على حسابك وتظهر على أي جهاز. العمولة بتتسجل على كل أوردر وقت إضافته، وتغيير الإعدادات مش بيغير الأوردرات القديمة.</div>
<button class="btn" id="csave">حفظ</button>
<h3 style="margin-top:20px">تغيير كلمة السر</h3><label>كلمة السر الجديدة</label><input id="npw" type="password" dir="ltr" autocomplete="new-password" placeholder="٦ حروف على الأقل"><button class="btn" id="pwb" style="background:var(--bl)">تغيير كلمة السر</button>
<button class="btn r" id="lo">تسجيل خروج</button>
<button class="btn s" id="ccl">إغلاق</button>
</div></div>

<div class="sh" id="lg"><div class="pn">
<h3>تسجيل الدخول</h3>
<label>الإيميل</label><input id="em" type="email" dir="ltr" autocomplete="email">
<label>كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">
<button class="btn" id="li">دخول</button>
<button class="btn s" id="su">إنشاء حساب جديد</button>
<div class="note" id="lm"></div>
</div></div>

<script>
var SB_URL='https://kuzdbttvyoltjrwazfqh.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1emRidHR2eW9sdGpyd2F6ZnFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MTM3NTUsImV4cCI6MjExMTI4OTc1NX0.aeVgGuzN9Wv9kA30mW8c_khEmVGWkS-6nBJtBWnYxlI';
var sb=supabase.createClient(SB_URL,SB_KEY);
var DEF={name:'المطعم',type:'pct',base:'fee',val:0};
var cfg=Object.assign({},DEF),prof={name:'',photo:'',logo:''},orders=[],shifts=[],range='cur',manual=false,uid=null;
function $(i){return document.getElementById(i)}
function dk(d){return d.toLocaleDateString('en-CA')}
function n(v){return Math.round((+v||0)*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fail(e){if(e)alert('حصل خطأ في الحفظ على الداتا بيز: '+(e.message||e))}
function hm(ms){var m=Math.round(ms/6e4);return Math.floor(m/60)+'س '+m%60+'د'}
function tm(t){return new Date(t).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
$('dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
function calc(price,fee){return n(cfg.type==='fix'?cfg.val:(cfg.base==='price'?price:fee)*cfg.val/100)}

function act(){return shifts.filter(function(s){return !s.end_ts})[0]}
function curShift(){return act()||shifts[0]}
function dur(s){return (s.end_ts||Date.now())-s.start_ts}

async function loadOrders(){var r=await sb.from('orders').select('*').order('ts',{ascending:false});if(r.error)fail(r.error);orders=r.data||[]}
async function loadShifts(){var r=await sb.from('shifts').select('*').order('start_ts',{ascending:false});if(r.error)fail(r.error);shifts=r.data||[]}
async function loadProf(){
 var r=await sb.from('profiles').select('*').eq('user_id',uid).maybeSingle();
 if(r.error)fail(r.error);
 prof={name:'',photo:'',logo:''};cfg=Object.assign({},DEF);
 if(r.data){prof={name:r.data.name||'',photo:r.data.photo||'',logo:r.data.logo||''};cfg=Object.assign(cfg,r.data.cfg||{})}}
async function saveProf(){var r=await sb.from('profiles').upsert({user_id:uid,name:prof.name,photo:prof.photo,logo:prof.logo,cfg:cfg,updated_at:new Date().toISOString()});fail(r.error)}
function applyProf(){
 var a=$('av');a.style.backgroundImage=prof.photo?'url('+prof.photo+')':'';a.textContent=prof.photo?'':'👤';
 if(prof.logo)$('logo').src=prof.logo;else $('logo').removeAttribute('src');$('logo').hidden=!prof.logo;
 $('h1').textContent=prof.name?'كابتن '+prof.name:'🛵 Tamara'}

async function toggleShift(){
 var s=act();
 if(s){if(!confirm('إنهاء الشفت؟'))return;s.end_ts=Date.now();render();var r=await sb.from('shifts').update({end_ts:s.end_ts}).eq('id',s.id);fail(r.error)}
 else{s={id:Date.now(),start_ts:Date.now(),end_ts:null};shifts.unshift(s);range='cur';setTab();render();var r2=await sb.from('shifts').insert(s);fail(r2.error)}}

var selDay=dk(new Date()),selShift='all';
function sday(s){return dk(new Date(s.start_ts))}
function odDay(o){var s=shifts.filter(function(x){return x.id===o.shift_id})[0];return s?sday(s):o.day}
function dayShifts(){return shifts.filter(function(s){return sday(s)===selDay}).sort(function(a,b){return a.start_ts-b.start_ts})}
function wk(){var w=new Date();w.setHours(0,0,0,0);return w.getTime()-6*864e5}
function filt(){
 var w=wk(),s=curShift();
 return orders.filter(function(o){
  if(range==='cur')return s&&o.shift_id===s.id;
  if(range==='week')return o.ts>=w;
  if(range==='day')return odDay(o)===selDay&&(selShift==='all'||o.shift_id==selShift);
  return true}).sort(function(a,b){return b.ts-a.ts})}
function shiftsIn(){
 var w=wk();
 if(range==='cur')return curShift()?[curShift()]:[];
 if(range==='week')return shifts.filter(function(s){return s.start_ts>=w});
 if(range==='day')return dayShifts().filter(function(s){return selShift==='all'||s.id==selShift});
 return shifts}
function netOf(L){var f=0,c=0;L.forEach(function(o){f+=+o.fee;c+=+o.comm||0});return n(f-c)}

function render(){
 var a=act();
 $('fb').hidden=range!=='day';
 if(range==='day'){$('fd').value=selDay;var ds=dayShifts();
  $('fs').innerHTML='<option value="all">كل شفتات اليوم ('+ds.length+')</option>'+ds.map(function(s,i){return '<option value="'+s.id+'">شفت '+(i+1)+' · '+tm(s.start_ts)+' ← '+(s.end_ts?tm(s.end_ts):'شغال')+'</option>'}).join('');
  if(ds.some(function(s){return s.id==selShift}))$('fs').value=selShift;else{selShift='all';$('fs').value='all'}}
 $('shb').className='shb'+(a?' on':'');
 $('shb').innerHTML=a?'<div><b>🟢 الشفت شغال</b><div class="sub">من '+tm(a.start_ts)+' · مدة '+hm(dur(a))+'</div></div><button onclick="toggleShift()">⏹ إنهاء الشفت</button>'
  :'<div><b>⚪ مفيش شفت شغال</b><div class="sub">ابدأ الشفت عشان تسجل أوردرات</div></div><button onclick="toggleShift()">▶ ابدأ الشفت</button>';
 var L=filt(),cnt=L.length,sales=0,fees=0,cm=0,dn=0,SH=shiftsIn(),ms=0,days={};
 L.forEach(function(o){sales+=+o.price;fees+=+o.fee;cm+=+o.comm||0;if(o.done)dn++});
 SH.forEach(function(s){ms+=dur(s);days[dk(new Date(s.start_ts))]=1});
 var nd=Object.keys(days).length,net=n(fees-cm);
 $('stats').innerHTML=
 '<div class="st hl"><span>صافي مكسبي (الشحن − العمولة)</span><b>'+net+' ج</b></div>'+
 '<div class="st"><span>ساعات الشغل</span><b>'+hm(ms)+'</b></div>'+
 '<div class="st"><span>أيام الشغل</span><b>'+nd+'</b></div>'+
 '<div class="st"><span>مكسب الساعة</span><b>'+(ms>=6e5?n(netOf(L.filter(function(o){return SH.some(function(s){return s.id===o.shift_id})}))/(ms/36e5))+' ج':'—')+'</b></div>'+
 '<div class="st"><span>عدد الأوردرات</span><b>'+cnt+'</b></div>'+
 '<div class="st"><span>عمولة '+esc(cfg.name)+'</span><b>'+n(cm)+' ج</b></div>'+
 '<div class="st"><span>مجموع الشحن</span><b>'+n(fees)+' ج</b></div>'+
 '<div class="st"><span>تم التسليم</span><b>'+dn+' / '+cnt+'</b></div>'+
 '<div class="st"><span>مجموع الطلبات</span><b>'+n(sales)+' ج</b></div>';
 var bars='',max=1,ds=[];
 for(var i=6;i>=0;i--){var d=new Date(Date.now()-i*864e5),k=dk(d),c=orders.filter(function(o){return odDay(o)===k}).length;ds.push([d,c]);if(c>max)max=c}
 ds.forEach(function(x){bars+='<div class="bar">'+x[1]+'<i style="height:'+(x[1]/max*70)+'%"></i>'+x[0].toLocaleDateString('ar-EG',{weekday:'narrow'})+'</div>'});
 $('bars').innerHTML=bars;
 $('shl').innerHTML=range==='cur'?'':'<h2>الورديات</h2>'+(SH.length?SH.map(function(s){
  var so=orders.filter(function(o){return o.shift_id===s.id});
  return '<div class="o"><div class="r1"><div class="ad">'+new Date(s.start_ts).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})+'</div><div class="tot">'+netOf(so)+' ج</div></div><div class="sub">'+tm(s.start_ts)+' → '+(s.end_ts?tm(s.end_ts):'شغال دلوقتي')+' · '+hm(dur(s))+' · '+so.length+' أوردر</div></div>'}).join(''):'<div class="empty">لا توجد ورديات</div>');
 $('list').innerHTML=L.length?L.map(function(o){
  return '<div class="o'+(o.done?' done':'')+'"><div class="r1"><div><div class="ad">'+esc(o.addr||'بدون عنوان')+'</div><div class="ph">'+esc(o.phone)+(o.phone2?' · '+esc(o.phone2):'')+'</div></div><div class="tot">'+n(+o.price+ +o.fee)+' ج</div></div>'+
  '<div class="sub">الطلب '+n(o.price)+' + شحن '+n(o.fee)+(+o.comm?' · عمولة '+n(o.comm):'')+' · '+tm(o.ts)+(o.done?' · ✅ تم':'')+'</div>'+
  '<div class="acts"><a class="call" href="tel:'+esc(o.phone)+'">📞 اتصال</a><a class="wa" target="_blank" rel="noopener" href="'+wa(o.phone)+'">💬 واتساب</a>'+(o.phone2?'<a class="call" href="tel:'+esc(o.phone2)+'">📞 رقم ٢</a><a class="wa" target="_blank" rel="noopener" href="'+wa(o.phone2)+'">💬 ٢</a>':'')+'</div><div class="acts">'+
  '<button class="'+(o.done?'un':'dn')+'" onclick="tg('+o.id+')">'+(o.done?'تراجع':'تم التسليم')+'</button>'+
  '<button class="x" onclick="rm('+o.id+')">🗑</button></div></div>'}).join(''):'<div class="empty">لا توجد أوردرات هنا بعد</div>';
}
async function tg(id){
 var o=orders.filter(function(x){return x.id===id})[0];if(!o)return;o.done=!o.done;render();
 var r=await sb.from('orders').update({done:o.done}).eq('id',id);fail(r.error)}
async function rm(id){
 if(!confirm('حذف الأوردر؟'))return;
 orders=orders.filter(function(o){return o.id!==id});render();
 var r=await sb.from('orders').delete().eq('id',id);fail(r.error)}

function sum(){
 var p=+$('pr').value||0,f=+$('fe').value||0;
 if(!manual)$('cm').value=calc(p,f)||'';
 $('sum').textContent='الإجمالي على العميل: '+n(p+f)+' ج · صافي مكسبك: '+n(f-(+$('cm').value||0))+' ج'}
$('pr').oninput=sum;$('fe').oninput=sum;$('cm').oninput=function(){manual=true;sum()};
$('add').onclick=function(){
 if(!act()){alert('ابدأ الشفت الأول');return}
 manual=false;$('cml').textContent='عمولة '+cfg.name;sum();$('sh').classList.add('on');$('ph').focus()};
function closeSh(){$('sh').classList.remove('on')}
$('cn').onclick=closeSh;
$('sh').onclick=function(e){if(e.target===this)closeSh()};
$('save').onclick=async function(){
 var p=$('ph').value.trim();if(!p){alert('اكتب رقم العميل');return}
 var s=act();if(!s){alert('الشفت خلص، ابدأ شفت جديد');closeSh();return}

function readImg(f,max){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();

 im.onerror=rej;im.src=u})}

/* === صوت + إشعارات (إضافة فقط) === */
var AC;
function snd(t){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  var P={add:[[660,0],[880,.09]],done:[[523,0],[659,.09],[784,.18]],undo:[[440,0],[330,.1]],
    del:[[330,0],[220,.1]],start:[[440,0],[660,.1],[880,.2]],end:[[880,0],[660,.1],[440,.2]]}[t]||[];
  P.forEach(function(p){
    var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+p[1];
    o.type='sine';o.frequency.value=p[0];
    g.gain.setValueAtTime(.0001,s);
    g.gain.exponentialRampToValueAtTime(.25,s+.01);
    g.gain.exponentialRampToValueAtTime(.0001,s+.15);
    o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.16)})
}catch(e){}}

function ntf(t,b,tag){try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var o={body:b,icon:'icon-192.png',tag:tag,vibrate:[120,60,120],lang:'ar',dir:'rtl'};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)
    navigator.serviceWorker.ready.then(function(r){r.showNotification(t,o)});
  else new Notification(t,o)
}catch(e){}}

var _ts=toggleShift;
toggleShift=function(){
  var s=act(),had=!!s;
  var r=_ts.apply(this,arguments),has=!!act();
  if(!had&&has){
    snd('start');
    try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  }else if(had&&!has){
    snd('end');
    var so=orders.filter(function(o){return o.shift_id===s.id});
    ntf('✅ خلص الشفت',so.length+' أوردر · صافي '+netOf(so)+' ج · '+hm(dur(s)),'end');
  }
  return r};

var _tg=tg;
tg=function(id){
  var o=orders.filter(function(x){return x.id===id})[0],was=o&&o.done;
  var r=_tg.apply(this,arguments);
  if(o&&o.done!==was)snd(o.done?'done':'undo');
  return r};

var _rm=rm;
rm=function(id){
  var c=orders.length,r=_rm.apply(this,arguments);
  if(orders.length<c)snd('del');
  return r};

var _sv=$('save').onclick;
$('save').onclick=function(){
  var c=orders.length,r=_sv.apply(this,arguments);
  if(orders.length>c)snd('add');
  return r};

setInterval(function(){try{
  var s=act();if(!uid||!s)return;
  var h=Math.floor(dur(s)/144e5),k='nh'+s.id;
  if(h>0&&(+localStorage.getItem(k)||0)<h){
    localStorage.setItem(k,h);
    ntf('🛵 الشفت لسه شغال','بقاله '+hm(dur(s))+'، لو خلصت إنهيه','shift')}
  var seen=JSON.parse(localStorage.getItem('nd')||'{}');
  orders.forEach(function(o){
    if(o.shift_id===s.id&&!o.done&&Date.now()-o.ts>27e5&&!seen[o.id]){
      seen[o.id]=1;ntf('📦 أوردر لسه ماتسلمش',o.addr||o.phone,'o'+o.id)}});
  localStorage.setItem('nd',JSON.stringify(seen))
}catch(e){}},60000);

 /* === تنبيه كل ٥ دقايق + إشعار ثابت أثناء الشفت === */
var KA=null;
function mkLoop(){
  var sr=8000,n=sr*300,d=new Uint8Array(44+n),v=new DataView(d.buffer);
  function s(o,t){for(var i=0;i<t.length;i++)d[o+i]=t.charCodeAt(i)}
  s(0,'RIFF');v.setUint32(4,36+n,true);s(8,'WAVEfmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);
  v.setUint16(34,8,true);s(36,'data');v.setUint32(40,n,true);
  d.fill(128,44);
  [[523.25,0],[659.25,.18],[783.99,.36],[1046.5,.54],[783.99,.9],[1046.5,1.1]].forEach(function(p){
    var st=Math.floor(p[1]*sr),len=Math.floor(.5*sr);
    for(var i=0;i<len;i++){
      var t=i/sr,e=Math.min(1,i/80)*Math.exp(-t*6),
          x=Math.sin(2*Math.PI*p[0]*t)+.3*Math.sin(4*Math.PI*p[0]*t),
          k=44+st+i,val=d[k]-128+Math.round(x*e*38);
      d[k]=Math.max(0,Math.min(255,val+128))}});
  return URL.createObjectURL(new Blob([d],{type:'audio/wav'}))}

function kaOn(){try{
  if(!KA){KA=new Audio(mkLoop());KA.loop=true}
  KA.play().then(function(){
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:'🛵 الشفت شغال',artist:'Tayar',album:'تنبيه كل ٥ دقايق',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
      navigator.mediaSession.setActionHandler('pause',kaOff);
      navigator.mediaSession.setActionHandler('play',kaOn)}
  }).catch(function(){})
}catch(e){}}
function kaOff(){try{if(KA){KA.pause();KA.currentTime=0}}catch(e){}}

var _ts2=toggleShift;
toggleShift=function(){var r=_ts2.apply(this,arguments);if(act())kaOn();else kaOff();return r};

/* لو فتحت التطبيق والشفت شغال، أول لمسة بترجّع التنبيه (المتصفح بيمنع الصوت من غير لمسة) */
document.addEventListener('click',function(){if(act()&&(!KA||KA.paused))kaOn()});
